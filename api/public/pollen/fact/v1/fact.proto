syntax = "proto3";

package pollen.fact.v1;

import "buf/validate/validate.proto";
import "pollen/admission/v1/admission.proto";

option go_package = "github.com/sambigeara/pollen/api/genpb/pollen/fact/v1;factv1";

message Fact {
  pollen.admission.v1.ResourceID resource = 1 [(buf.validate.field).required = true];
  pollen.admission.v1.Predicate policy = 2;
  bytes body_hash = 3 [(buf.validate.field).bytes = {len: 32}];
  bytes authority_pub = 4 [(buf.validate.field).bytes = {len: 32}];
  uint64 seq = 5;
  bytes signature = 6 [(buf.validate.field).bytes = {len: 64}];
  bool deleted = 7;
}

message BlobWrapping {
  bytes blob_hash = 1 [(buf.validate.field).bytes = {len: 32}];
  bytes recipient_pub = 2 [(buf.validate.field).bytes = {len: 32}];
  bytes wrapped_dek = 3;
  bytes authority_pub = 4 [(buf.validate.field).bytes = {len: 32}];
  uint64 seq = 5;
  bytes signature = 6 [(buf.validate.field).bytes = {len: 64}];
}
