syntax = "proto3";

package pollen.mesh.v1;

import "pollen/identity/v1/identity.proto";
import "pollen/state/v1/state.proto";

option go_package = "github.com/sambigeara/pollen/api/genpb/pollen/mesh/v1;meshv1";

message PunchCoordRequest {
  bytes peer_pub = 1;
}

message PunchCoordTrigger {
  bytes peer_pub = 1;
  string self_addr = 2;
  string peer_addr = 3;
}

message InviteRedeemRequest {
  pollen.identity.v1.InviteTicket ticket = 1;
  bytes peer_pub = 2;
}

message InviteRedeemResponse {
  bool accepted = 1;
  string reason = 2;
  pollen.identity.v1.GrantToken grant_token = 3;
}

message ObservedAddress {
  string addr = 1;
}

message ForwardedInviteRedeemRequest {
  InviteRedeemRequest inner = 1;
  bytes joiner_pub = 2;
}

message ForwardedInviteRedeemResponse {
  InviteRedeemResponse inner = 1;
  bytes joiner_pub = 2;
}

message Envelope {
  oneof body {
    PunchCoordRequest punch_coord_request = 1;
    PunchCoordTrigger punch_coord_trigger = 2;
    InviteRedeemRequest invite_redeem_request = 3;
    InviteRedeemResponse invite_redeem_response = 4;
    ObservedAddress observed_address = 5;
    pollen.state.v1.GossipEventBatch events = 6;
    ForwardedInviteRedeemRequest forwarded_invite_request = 10;
    ForwardedInviteRedeemResponse forwarded_invite_response = 11;
  }
  reserved 7, 8, 12, 13;
  bytes trace_id = 9;
}
