syntax = "proto3";

package pollen.admission.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/sambigeara/pollen/api/genpb/pollen/admission/v1;admissionv1";

message BootstrapPeer {
  bytes peer_pub = 1 [(buf.validate.field).bytes = {len: 32}];
  repeated string addrs = 2 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {min_len: 1}
    }
  }];
  // host:port of this peer's TLS+mTLS control listener (control-tls).
  // Empty if the peer has no wire listener. Joiners writing a ctx may use
  // this as the wire fallback so the CLI keeps working when the local
  // daemon is down. No scheme: callers prepend `pln://` for display.
  string wire_endpoint = 3;
}

message AccessTokenClaims {
  ResourceID resource = 1 [(buf.validate.field).required = true];
  bytes issuer_pub = 2 [(buf.validate.field).bytes = {len: 32}];
  int64 issued_at_unix = 3;
  int64 expires_at_unix = 4;
}

message AccessToken {
  AccessTokenClaims claims = 1 [(buf.validate.field).required = true];
  bytes signature = 2 [(buf.validate.field).bytes = {len: 64}];
}

message ResourceID {
  oneof body {
    SeedID seed = 1;
    BlobID blob = 2;
    StaticID static = 3;
    ServiceID service = 4;
  }
}

message SeedID {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  bytes hash = 2 [(buf.validate.field).bytes = {len: 32}];
}

message BlobID {
  string name = 1 [(buf.validate.field).string = {max_len: 255}];
  bytes digest = 2 [(buf.validate.field).bytes = {len: 32}];
}

message StaticID {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  bytes manifest_digest = 2 [(buf.validate.field).bytes = {len: 32}];
}

message ServiceID {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

message Predicate {
  InlinePredicate inline = 1;
  // public, when true, permits anonymous callers (no grant) and
  // short-circuits attribute clause evaluation. The HTTP gateway's
  // canonical URL (`<sub>.pln.sh/<slug>/<resource>`) is the entry
  // point that surfaces this.
  bool public = 2;
}

message InlinePredicate {
  repeated Clause clauses = 1;
}

message Clause {
  string key = 1 [(buf.validate.field).string = {min_len: 1}];
  string equals = 2;
  reserved 3;
  reserved "in";
}
